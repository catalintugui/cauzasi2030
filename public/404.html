<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Căuzași 2030</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-primary: #1f352d;
        --color-primary-soft: #5e6f57;
        --color-gold: #b8974a;
        --color-cream: #f4efe6;
        --color-beige: #e7e1d2;
        --color-white: #ffffff;
        --font-serif: "Cormorant Garamond", Georgia, serif;
        --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: var(--font-sans);
        color: var(--color-primary);
        background:
          radial-gradient(ellipse at 20% 10%, rgba(168, 178, 138, 0.45), transparent 50%),
          radial-gradient(ellipse at 90% 80%, rgba(184, 151, 74, 0.18), transparent 45%),
          linear-gradient(155deg, #f8f4ec 0%, var(--color-cream) 40%, var(--color-beige) 100%);
      }

      main {
        width: min(520px, 100%);
        padding: clamp(28px, 5vw, 48px);
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.94),
          rgba(231, 225, 210, 0.68)
        );
        border: 1px solid rgba(31, 53, 45, 0.12);
        box-shadow: 0 16px 48px rgba(31, 53, 45, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-family: var(--font-serif);
        font-size: clamp(2rem, 5vw, 2.6rem);
        font-weight: 700;
        line-height: 1.15;
      }

      p {
        margin: 0 0 28px;
        color: var(--color-primary-soft);
        font-size: 1.05rem;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        padding: 0 24px;
        border-radius: 8px;
        color: var(--color-white);
        background: var(--color-primary);
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 16px 34px rgba(37, 100, 58, 0.28);
        transition: background 180ms ease, transform 180ms ease;
      }

      a:hover {
        background: #162820;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pagina nu a fost găsită.</h1>
      <a href="/">Înapoi la pagina principală</a>
    </main>
  </body>
</html>
